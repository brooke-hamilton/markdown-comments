<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Markdown comments</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <div><strong id="title">Markdown comments</strong><small id="path"></small></div>
        <button id="refresh" type="button">Refresh</button>
    </header>
    <p id="notice" role="status" aria-live="polite">Loading document...</p>
    <main>
        <article id="document" aria-label="Rendered Markdown"></article>
        <aside aria-label="Document comments">
            <section id="composer">
                <h2>Comment on a passage</h2>
                <p class="hint">Select text in the document, then choose feedback or write your own. For diagrams, use "Comment on diagram".</p>
                <blockquote id="selection">No passage selected.</blockquote>
                <div id="presets" aria-label="Standard feedback"></div>
                <form id="feedback-form">
                    <label for="feedback">Custom feedback</label>
                    <textarea id="feedback" maxlength="8000" rows="4" placeholder="Tell Copilot what to change..."></textarea>
                    <button id="send" type="submit" disabled>Send to Copilot</button>
                </form>
            </section>
            <h2>Comments <span id="count"></span></h2>
            <div id="comments"></div>
        </aside>
    </main>
    <script type="module" src="./app.js"></script>
</body>
</html>
